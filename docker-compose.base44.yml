# Base44 dev environment for Loomwright (static PWA, no build step).
# nginx serves the bind-mounted repo directly with no-cache headers, mirroring tools/serve-local.ps1.
services:
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./.base44/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/index.html && wget -q -O /dev/null http://127.0.0.1/app.js || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
