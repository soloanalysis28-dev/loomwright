# Full nginx main config. Workers run as root because the sandbox checkout is mode 0700 (root-only).
user root;
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile off;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Development: never cache, so edits show on reload (mirrors tools/serve-local.ps1).
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;
        if_modified_since off;

        location ~ /\. { deny all; }
        location ~ \.webmanifest$ { types { } default_type application/manifest+json; try_files $uri =404; }
        location ~ \.mjs$ { types { } default_type "text/javascript; charset=utf-8"; try_files $uri =404; }
        location / { try_files $uri $uri/ =404; }
    }
}
