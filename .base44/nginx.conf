# Base44 dev proxy for Loomwright.
# Inner server (8080): plain static file serving of the bind-mounted repo.
# Outer server (80, public): proxies the inner server and applies dev-only
# adjustments that the Base44 preview needs and that must NOT touch app code:
#   1. sub_filter relaxes the index.html CSP so app.base44.com's preview
#      bridge scripts can run (the app CSP blocks everything external).
#   2. /sw.js is replaced by .base44/dev-sw.js, which unregisters the offline
#      worker and clears its cache-first copies, keeping edits visible.
# Workers run as root because the sandbox checkout is mode 0700 (root-only);
# the stock nginx user gets "Permission denied" -> 404 everywhere.
user root;
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile off;

    # --- inner: static content ---
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        location ~ /\. { deny all; }
        location ~ \.webmanifest$ { types { } default_type application/manifest+json; try_files $uri =404; }
        location ~ \.mjs$ { types { } default_type "text/javascript; charset=utf-8"; try_files $uri =404; }
        location / { try_files $uri $uri/ =404; }
    }

    # --- outer: public entry, dev adjustments ---
    server {
        listen 80;
        server_name _;

        # Development: never cache, so edits show on reload (mirrors tools/serve-local.ps1).
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;

        # Dev-only CSP relaxation so the Base44 preview bridge can load and run.
        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter 'default-src \'self\';' 'default-src \'self\' https://app.base44.com wss://app.base44.com;';
        sub_filter 'script-src \'self\';' 'script-src \'self\' \'unsafe-inline\' https://app.base44.com;';
        sub_filter 'style-src \'self\' \'unsafe-inline\';' 'style-src \'self\' \'unsafe-inline\' https://app.base44.com;';
        sub_filter 'img-src \'self\' data:;' 'img-src \'self\' data: https://app.base44.com;';
        sub_filter 'connect-src \'self\';' 'connect-src \'self\' https://app.base44.com wss://app.base44.com;';
        sub_filter 'worker-src \'self\';' 'worker-src \'self\' blob:;';
        sub_filter 'frame-src \'none\';' 'frame-src https://app.base44.com;';
        sub_filter 'child-src \'none\';' 'child-src https://app.base44.com;';

        # Dev-only: stub service worker so the offline cache never hides edits.
        location = /sw.js {
            default_type "text/javascript; charset=utf-8";
            alias /usr/share/nginx/html/.base44/dev-sw.js;
        }

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
        }
    }
}
