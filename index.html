<!DOCTYPE html>
<html lang="en" data-palette="parchment" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loomwright</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{ --danger:#c15540; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }

[data-palette="parchment"][data-theme="light"]{ --bg:#faf8f4; --panel:#fff; --ink:#1f1c18; --sub:#6b645a; --line:#e8e2d8; --accent:#8a5a44; --accent2:#4a6b5a; --card:#f3efe6; }
[data-palette="parchment"][data-theme="dark"]{ --bg:#181613; --panel:#211e1a; --ink:#efe9e0; --sub:#a79f92; --line:#332e28; --accent:#d3a184; --accent2:#8fbfa4; --card:#26221d; }
[data-palette="slate"][data-theme="light"]{ --bg:#f4f6f8; --panel:#fff; --ink:#1c2430; --sub:#5b6673; --line:#dde3e8; --accent:#3b6ea5; --accent2:#5b8a72; --card:#eaeef2; }
[data-palette="slate"][data-theme="dark"]{ --bg:#12161c; --panel:#1a1f27; --ink:#e6ebf0; --sub:#8b97a5; --line:#2a313b; --accent:#7aa8d9; --accent2:#8fc4a3; --card:#1f242c; }
[data-palette="forest"][data-theme="light"]{ --bg:#f6f7f0; --panel:#fff; --ink:#20281f; --sub:#5f6b57; --line:#dfe4d3; --accent:#5b7a4f; --accent2:#a2703f; --card:#eef1e3; }
[data-palette="forest"][data-theme="dark"]{ --bg:#141712; --panel:#1b1f17; --ink:#e6ecdd; --sub:#93a086; --line:#2c3325; --accent:#8bb377; --accent2:#d19a63; --card:#20261b; }
[data-palette="ink"][data-theme="light"]{ --bg:#fafafa; --panel:#fff; --ink:#161616; --sub:#6e6e6e; --line:#e2e2e2; --accent:#8a6a3f; --accent2:#5e5e5e; --card:#f1f1f1; }
[data-palette="ink"][data-theme="dark"]{ --bg:#121212; --panel:#191919; --ink:#ededed; --sub:#9a9a9a; --line:#2c2c2c; --accent:#c9a06b; --accent2:#a8a8a8; --card:#1f1f1f; }

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Iowan Old Style',serif;height:100%;transition:background .2s,color .2s}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1100px;margin:0 auto}
header{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
header h1{font-size:1.3rem;margin:0;letter-spacing:.02em}
header h1 span{color:var(--accent)}
.hdr-right{display:flex;align-items:center;gap:10px;font-family:-apple-system,Segoe UI,sans-serif}
.stats{font-size:.8rem;color:var(--sub)}
.hdr-right select{font-family:inherit;font-size:.75rem;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
nav{display:flex;gap:4px;padding:10px 20px 0;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{font-family:-apple-system,Segoe UI,sans-serif;background:none;border:none;padding:10px 14px;cursor:pointer;color:var(--sub);font-size:.85rem;border-bottom:2px solid transparent;white-space:nowrap}
nav button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{flex:1;overflow:auto;padding:20px}
.view{display:none}
.view.active{display:block}

.sec-list{display:flex;gap:16px;align-items:flex-start}
.sec-sidebar{width:220px;flex-shrink:0}
.sec-item{padding:9px 10px;border-radius:8px;cursor:pointer;font-family:-apple-system,Segoe UI,sans-serif;font-size:.85rem;color:var(--sub);margin-bottom:2px;display:flex;justify-content:space-between}
.sec-item:hover{background:var(--card)}
.sec-item.active{background:var(--card);color:var(--ink);font-weight:600}
.sec-item small{opacity:.6}
.write-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.write-top select{flex:1;min-width:160px;font-family:-apple-system,Segoe UI,sans-serif;font-size:.9rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.addbtn{padding:8px 14px;border:1px dashed var(--line);background:none;border-radius:8px;color:var(--sub);font-family:-apple-system,Segoe UI,sans-serif;font-size:.8rem;cursor:pointer;white-space:nowrap}
.importbtn{padding:8px 14px;border:1px solid var(--line);background:var(--card);border-radius:8px;color:var(--ink);font-family:-apple-system,Segoe UI,sans-serif;font-size:.8rem;cursor:pointer;white-space:nowrap}
.editor{width:100%}
.editor input[type=text]{width:100%;font-size:1.15rem;font-family:inherit;border:none;background:none;color:var(--ink);padding:4px 0;border-bottom:1px solid var(--line);margin-bottom:10px}
.toolbar{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.toolbar button{padding:6px 10px;border:1px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer;font-family:-apple-system,Segoe UI,sans-serif;font-size:.78rem;color:var(--ink)}
.toolbar button:hover{background:var(--line)}
[contenteditable]{width:100%;min-height:55vh;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:20px;font-size:1.05rem;line-height:1.7;font-family:inherit;overflow-y:auto}
[contenteditable] h1{font-size:1.4rem;margin:.4em 0}
[contenteditable] h2{font-size:1.2rem;margin:.4em 0}
[contenteditable] p{margin:0 0 .8em}
.editor .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-family:-apple-system,Segoe UI,sans-serif;font-size:.78rem;color:var(--sub)}
.del{color:var(--danger);cursor:pointer;background:none;border:none;font-family:-apple-system,Segoe UI,sans-serif;font-size:.78rem}

.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.char-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;font-family:-apple-system,Segoe UI,sans-serif}
.char-card h3{margin:0 0 4px;font-family:Georgia,serif;color:var(--accent)}
.char-card .count{font-size:.75rem;color:var(--sub);margin-bottom:8px}
.char-card textarea{width:100%;min-height:60px;font-size:.82rem;border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--bg);color:var(--ink);font-family:inherit}
.char-card .chapters{margin-top:8px;font-size:.72rem;color:var(--sub)}
.empty{color:var(--sub);font-family:-apple-system,Segoe UI,sans-serif;font-size:.85rem;padding:20px;text-align:center}

#webcanvas{width:100%;height:60vh;border:1px solid var(--line);border-radius:10px;background:var(--panel);touch-action:none}
.web-hint{font-family:-apple-system,Segoe UI,sans-serif;font-size:.78rem;color:var(--sub);margin-top:8px}

.ai-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;font-family:-apple-system,Segoe UI,sans-serif}
.ai-box select,.ai-box textarea{width:100%;font-family:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--bg);color:var(--ink);margin-top:6px}
.ai-box textarea{min-height:90px}
.ai-box label{font-size:.78rem;color:var(--sub);font-weight:600;display:block;margin-top:14px}
.btnrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button.primary{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:7px;font-family:-apple-system,Segoe UI,sans-serif;font-size:.82rem;cursor:pointer}
button.ghost{background:none;border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:7px;font-family:-apple-system,Segoe UI,sans-serif;font-size:.82rem;cursor:pointer}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-family:-apple-system,Segoe UI,sans-serif;font-size:.8rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Loom<span>wright</span></h1>
    <div class="hdr-right">
      <select id="palette-select">
        <option value="parchment">Parchment</option>
        <option value="slate">Slate</option>
        <option value="forest">Forest</option>
        <option value="ink">Ink</option>
      </select>
      <select id="theme-select">
        <option value="auto">Auto</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
      <div class="stats" id="sync-status" title="">○ Local only</div>
      <div class="stats" id="totalstats">0 words</div>
    </div>
  </header>
  <nav>
    <button class="tab active" data-view="write">Write</button>
    <button class="tab" data-view="characters">Characters</button>
    <button class="tab" data-view="web">Story Web</button>
    <button class="tab" data-view="ai">AI Assist</button>
  </nav>
  <main>
    <div class="view active" id="view-write">
      <div class="write-top">
        <select id="section-select"></select>
        <button class="addbtn" onclick="addSection()">+ New Section</button>
        <button class="importbtn" onclick="document.getElementById('file-input').click()">⇪ Import</button>
        <input type="file" id="file-input" accept=".txt,.docx,.pdf" multiple style="display:none">
      </div>
      <div class="editor" id="editor-wrap"></div>
    </div>
    <div class="view" id="view-characters"><div id="char-grid" class="char-grid"></div></div>
    <div class="view" id="view-web">
      <svg id="webcanvas"></svg>
      <div class="web-hint">Drag nodes to rearrange. Lines connect characters who appear together in the same section.</div>
    </div>
    <div class="view" id="view-ai">
      <div class="ai-box">
        <label>Section to send</label>
        <select id="ai-section"></select>
        <label>Prompt template</label>
        <textarea id="ai-template">Here is a section from my story. Please suggest improvements to pacing, clarity, and voice. Keep my style, just tighten and elevate it.

---
{{TEXT}}</textarea>
        <div class="btnrow"><button class="primary" onclick="copyPrompt()">Copy Prompt for Claude/ChatGPT</button></div>
        <label>Paste AI response back here</label>
        <textarea id="ai-response" placeholder="Paste what Claude or ChatGPT gave you..."></textarea>
        <div class="btnrow"><button class="ghost" onclick="insertResponse()">Insert into current section</button></div>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let state = JSON.parse(localStorage.getItem('loomwright_state') || 'null') || {
  sections: [{id:1, title:'Chapter 1', html:'<p></p>'}],
  activeId: 1,
  settings: {palette:'parchment', theme:'auto'},
  charNotes: {}
};
if(!state.settings) state.settings = {palette:'parchment', theme:'auto'};
if(!state.charNotes){
  state.charNotes = JSON.parse(localStorage.getItem('loomwright_notes')||'{}');
}
state.sections.forEach(s=>{ if(s.text!==undefined && !s.html){ s.html = s.text.split(/\n\n+/).map(p=>'<p>'+escapeHtml(p)+'</p>').join(''); delete s.text; } });
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let dbRef = null, dbSaveTimer = null;
function setSyncStatus(msg, ok){
  const el = document.getElementById('sync-status');
  el.textContent = (ok?'● ':'○ ') + msg;
}
async function initDB(){
  try{
    if(!window.claude) return;
    dbRef = await claude.use('db');
    if(!dbRef){ return; }
    const doc = await dbRef.doc('data/state').get();
    if(doc && doc.exists && doc.data && doc.data.sections){
      // Remote copy exists — prefer it as source of truth across devices
      state = doc.data;
      localStorage.setItem('loomwright_state', JSON.stringify(state));
      renderSidebar(); renderEditor();
    } else {
      // Seed the remote doc with whatever we have locally
      await dbRef.doc('data/state').set(state);
    }
    setSyncStatus('Synced', true);
  } catch(e){
    setSyncStatus('Local only', false);
  }
}
function save(){
  localStorage.setItem('loomwright_state', JSON.stringify(state));
  if(dbRef){
    clearTimeout(dbSaveTimer);
    dbSaveTimer = setTimeout(async ()=>{
      try{ await dbRef.doc('data/state').set(state); setSyncStatus('Synced', true); }
      catch(e){ setSyncStatus('Sync failed', false); }
    }, 800);
  }
}

function applyTheme(){
  let resolved = state.settings.theme;
  if(resolved==='auto') resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light';
  document.documentElement.setAttribute('data-theme', resolved);
  document.documentElement.setAttribute('data-palette', state.settings.palette);
  document.getElementById('palette-select').value = state.settings.palette;
  document.getElementById('theme-select').value = state.settings.theme;
}
document.getElementById('palette-select').onchange = e=>{ state.settings.palette=e.target.value; save(); applyTheme(); };
document.getElementById('theme-select').onchange = e=>{ state.settings.theme=e.target.value; save(); applyTheme(); };
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(state.settings.theme==='auto') applyTheme(); });
applyTheme();

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('view-'+t.dataset.view).classList.add('active');
    if(t.dataset.view==='characters') renderCharacters();
    if(t.dataset.view==='web') renderWeb();
    if(t.dataset.view==='ai') renderAI();
  };
});

function textOf(html){
  const d=document.createElement('div'); d.innerHTML=html;
  d.querySelectorAll('p,div,li,h1,h2,br').forEach(el=>el.insertAdjacentText('afterend','\n'));
  return d.textContent||'';
}
function wc(html){ const t=textOf(html).trim(); return t? t.split(/\s+/).length : 0; }
function totalWords(){ return state.sections.reduce((a,s)=>a+wc(s.html),0); }

function renderSidebar(){
  const sel = document.getElementById('section-select');
  sel.innerHTML = '';
  state.sections.forEach(s=>{
    const o = document.createElement('option');
    o.value = s.id; o.textContent = `${s.title||'Untitled'} (${wc(s.html)}w)`;
    sel.appendChild(o);
  });
  sel.value = state.activeId;
  sel.onchange = ()=>{ state.activeId = Number(sel.value); save(); renderEditor(); };
  document.getElementById('totalstats').textContent = totalWords()+' words total';
}
function cmd(c,v=null){ document.execCommand(c,false,v); document.getElementById('content-editable').focus(); }
function renderEditor(){
  const s = state.sections.find(x=>x.id===state.activeId);
  const wrap = document.getElementById('editor-wrap');
  if(!s){ wrap.innerHTML = '<div class="empty">No section selected.</div>'; return; }
  wrap.innerHTML = `
    <input type="text" id="title-input" value="${s.title.replace(/"/g,'&quot;')}">
    <div class="toolbar">
      <button onclick="cmd('bold')"><b>B</b></button>
      <button onclick="cmd('italic')"><i>I</i></button>
      <button onclick="cmd('underline')"><u>U</u></button>
      <button onclick="cmd('formatBlock','H1')">H1</button>
      <button onclick="cmd('formatBlock','H2')">H2</button>
      <button onclick="cmd('formatBlock','P')">¶</button>
      <button onclick="cmd('insertUnorderedList')">• List</button>
      <button onclick="cmd('insertOrderedList')">1. List</button>
      <button onclick="cmd('removeFormat')">Clear</button>
    </div>
    <div contenteditable="true" id="content-editable">${s.html}</div>
    <div class="row"><span id="livecount">${wc(s.html)} words</span><button class="del" onclick="delSection(${s.id})">Delete section</button></div>
  `;
  document.getElementById('title-input').oninput = e=>{ s.title=e.target.value; save(); renderSidebar(); };
  document.getElementById('content-editable').oninput = e=>{
    s.html=e.target.innerHTML; save();
    document.getElementById('livecount').textContent = wc(s.html)+' words';
    document.getElementById('totalstats').textContent = totalWords()+' words total';
  };
}
function addSection(){
  const id = Date.now();
  state.sections.push({id, title:'New Section', html:'<p></p>'});
  state.activeId = id; save(); renderSidebar(); renderEditor();
}
function delSection(id){
  if(state.sections.length===1){ toast("Can't delete your only section"); return; }
  state.sections = state.sections.filter(s=>s.id!==id);
  state.activeId = state.sections[0].id; save(); renderSidebar(); renderEditor();
}

document.getElementById('file-input').onchange = async e=>{
  for(const file of e.target.files){
    try{
      const name = file.name.replace(/\.(docx|pdf|txt)$/i,'');
      let html = '';
      if(file.name.toLowerCase().endsWith('.docx')){
        const buf = await file.arrayBuffer();
        const result = await mammoth.convertToHtml({arrayBuffer: buf});
        html = result.value || '<p></p>';
      } else if(file.name.toLowerCase().endsWith('.pdf')){
        const buf = await file.arrayBuffer();
        const doc = await pdfjsLib.getDocument({data: buf}).promise;
        let paras = [];
        for(let i=1;i<=doc.numPages;i++){
          const page = await doc.getPage(i);
          const content = await page.getTextContent();
          const text = content.items.map(it=>it.str).join(' ');
          paras.push('<p>'+escapeHtml(text)+'</p>');
        }
        html = paras.join('');
        toast('PDF imported as plain text (formatting not preserved)');
      } else {
        const text = await file.text();
        html = text.split(/\n\n+/).map(p=>'<p>'+escapeHtml(p)+'</p>').join('');
      }
      const id = Date.now()+Math.floor(Math.random()*1000);
      state.sections.push({id, title:name, html});
      state.activeId = id;
    } catch(err){
      toast('Could not import '+file.name);
      console.error(err);
    }
  }
  save(); renderSidebar(); renderEditor();
  e.target.value = '';
};

const STOPWORDS = new Set(['The','A','An','I','He','She','They','We','It','You','Us','Them','Its','Your','Yours','Yourself','Our','Ours','Ourselves','Themselves','Himself','Herself','Myself','Someone','Somebody','Something','Somewhere','Somehow','Anyone','Anybody','Anything','Anywhere','Everyone','Everybody','Everything','Everywhere','Nothing','Nobody','Nowhere','None',
  'But','And','Or','Nor','So','Yet','If','When','Then','Than','There','Here','This','That','These','Those','His','Her','Their',
  'Because','Although','Though','While','Since','Unless','Until','After','Before','Above','Below','Between','Among','Beyond','Within','Without','Through','Across','Around','Toward','Towards','During','Despite',
  'Perhaps','Suddenly','Meanwhile','However','Instead','Otherwise','Still','Also','Even','Just','Now','Soon','Later','Finally','Eventually','Indeed','Certainly','Probably','Maybe','Well','Oh','Ah','Yes','No','Okay','Alright','Sure','Right','Look','Listen','Wait','Stop','Come','Go','Let','Once','Again','Almost','Already','Always','Never','Every','Each','Both','Few','Many','Most','Some','All','Any',
  'Can','Could','Would','Should','Will','Shall','Must','May','Might','Do','Does','Did','Am','Is','Are','Was','Were','Being','Been','Have','Has','Had',
  'Sorry','Please','Thanks','Thank','Hello','Hi','Hey','Goodbye','Bye','Congratulations','Welcome',
  'Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday','January','February','March','April','May','June','July','August','September','October','November','December',
  'Chapter','Prologue','Epilogue','Part']);

function detectCharacters(){
  // Signal 1: case consistency — collect every word ever seen in plain lowercase
  // anywhere in the manuscript. A real name never doubles as an ordinary word.
  const lowerSeen = new Set();
  state.sections.forEach(s=>{
    const plain = textOf(s.html).replace(/\n+/g, '. ');
    (plain.match(/[A-Za-z']+/g) || []).forEach(w=>{ if(/^[a-z][a-z']{2,}$/.test(w)) lowerSeen.add(w); });
  });

  const counts = {}; // name -> {count, sections:Set, midHits, afterDeterminer}
  state.sections.forEach(s=>{
    let plain = textOf(s.html).replace(/\n+/g, '. ');
    const tokens = plain.match(/[A-Za-z']+|[.!?]|["“”:]/g) || [];
    let atStart = true, prevWord = '';
    const seen = new Set();
    tokens.forEach(tok=>{
      if(tok==='.'||tok==='!'||tok==='?'||tok==='"'||tok==='“'||tok==='”'||tok===':'){ atStart = true; return; }
      if(/^[A-Z][a-z]{2,}$/.test(tok) && !STOPWORDS.has(tok)){
        if(!counts[tok]) counts[tok] = {count:0, sections:new Set(), midHits:0, afterDeterminer:0};
        counts[tok].count++;
        if(!atStart) counts[tok].midHits++;
        // Signal 2: determiner adjacency — "the/a/an X" reads as a common noun or
        // title ("the King"), not a personal name ("the Marcus" doesn't happen).
        if(prevWord==='the'||prevWord==='a'||prevWord==='an') counts[tok].afterDeterminer++;
        seen.add(tok);
      }
      prevWord = tok.toLowerCase();
      atStart = false;
    });
    seen.forEach(w=>counts[w].sections.add(s.title||'Untitled'));
  });
  return Object.entries(counts).filter(([n,d])=>{
    if(d.count<2 || d.midHits<1) return false;                 // must recur, and not only at sentence-start
    if(lowerSeen.has(n.toLowerCase())) return false;            // also used as an ordinary word -> not a name
    if(d.afterDeterminer/d.count > 0.4) return false;           // usually "the/a/an X" -> common noun or title
    return true;
  }).sort((a,b)=>b[1].count-a[1].count);
}
function renderCharacters(){
  const grid = document.getElementById('char-grid');
  const chars = detectCharacters();
  if(!chars.length){ grid.innerHTML = '<div class="empty">No recurring characters detected yet. Names mentioned 2+ times across your sections will show up here.</div>'; return; }
  grid.innerHTML = '';
  chars.forEach(([name,d])=>{
    const c = document.createElement('div'); c.className='char-card';
    c.innerHTML = `<h3>${name}</h3><div class="count">Mentioned ${d.count} times</div>
      <textarea placeholder="Role, notes...">${state.charNotes[name]||''}</textarea>
      <div class="chapters">Appears in: ${[...d.sections].join(', ')}</div>`;
    c.querySelector('textarea').oninput = e=>{ state.charNotes[name]=e.target.value; save(); };
    grid.appendChild(c);
  });
}

function renderWeb(){
  const svg = document.getElementById('webcanvas');
  const chars = detectCharacters().slice(0,15);
  if(!chars.length){
    const div = document.createElement('div'); div.className='empty'; div.id='webcanvas-ph'; div.textContent='Add characters (mentioned 2+ times) to see the web.';
    svg.replaceWith(div); return;
  }
  svg.innerHTML='';
  const w = svg.clientWidth||700, h = svg.clientHeight||400, cx=w/2, cy=h/2, r=Math.min(w,h)/2-60;
  const nodes = chars.map(([name,d],i)=>{ const a=(i/chars.length)*Math.PI*2; return {name,x:cx+r*Math.cos(a),y:cy+r*Math.sin(a),sections:d.sections}; });
  const ns='http://www.w3.org/2000/svg';
  const edgeLayer = document.createElementNS(ns,'g');
  for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
    if([...nodes[i].sections].some(x=>nodes[j].sections.has(x))){
      const line=document.createElementNS(ns,'line');
      line.setAttribute('x1',nodes[i].x);line.setAttribute('y1',nodes[i].y);line.setAttribute('x2',nodes[j].x);line.setAttribute('y2',nodes[j].y);
      line.setAttribute('stroke','var(--line)');line.setAttribute('stroke-width','1.5');line.dataset.a=i;line.dataset.b=j;
      edgeLayer.appendChild(line);
    }
  }
  svg.appendChild(edgeLayer);
  const nodeLayer = document.createElementNS(ns,'g');
  nodes.forEach((n,i)=>{
    const g=document.createElementNS(ns,'g'); g.style.cursor='grab';
    const circ=document.createElementNS(ns,'circle'); circ.setAttribute('cx',n.x);circ.setAttribute('cy',n.y);circ.setAttribute('r',22);circ.setAttribute('fill','var(--accent2)');circ.setAttribute('opacity','0.85');
    const text=document.createElementNS(ns,'text'); text.setAttribute('x',n.x);text.setAttribute('y',n.y+38);text.setAttribute('text-anchor','middle');text.setAttribute('font-size','12');text.setAttribute('fill','var(--ink)');text.setAttribute('font-family','sans-serif');text.textContent=n.name;
    g.appendChild(circ); g.appendChild(text);
    let dragging=false;
    g.addEventListener('pointerdown',e=>{dragging=true;g.setPointerCapture(e.pointerId);});
    g.addEventListener('pointermove',e=>{
      if(!dragging)return;
      const rect=svg.getBoundingClientRect(); n.x=e.clientX-rect.left; n.y=e.clientY-rect.top;
      circ.setAttribute('cx',n.x);circ.setAttribute('cy',n.y);text.setAttribute('x',n.x);text.setAttribute('y',n.y+38);
      edgeLayer.querySelectorAll('line').forEach(line=>{
        const a=+line.dataset.a,b=+line.dataset.b;
        if(a===i){line.setAttribute('x1',n.x);line.setAttribute('y1',n.y);}
        if(b===i){line.setAttribute('x2',n.x);line.setAttribute('y2',n.y);}
      });
    });
    g.addEventListener('pointerup',()=>dragging=false);
    nodeLayer.appendChild(g);
  });
  svg.appendChild(nodeLayer);
}

function renderAI(){
  const sel = document.getElementById('ai-section'); sel.innerHTML='';
  state.sections.forEach(s=>{ const o=document.createElement('option'); o.value=s.id; o.textContent=s.title; sel.appendChild(o); });
  sel.value = state.activeId;
}
function copyPrompt(){
  const s = state.sections.find(x=>x.id==document.getElementById('ai-section').value);
  const tpl = document.getElementById('ai-template').value;
  const prompt = tpl.replace('{{TEXT}}', s? textOf(s.html) : '');
  navigator.clipboard.writeText(prompt).then(()=>toast('Prompt copied — paste into Claude or ChatGPT'));
}
function insertResponse(){
  const resp = document.getElementById('ai-response').value;
  const s = state.sections.find(x=>x.id===state.activeId);
  if(!s || !resp.trim()){ toast('Nothing to insert'); return; }
  s.html += '<p>'+escapeHtml(resp)+'</p>';
  save(); renderEditor(); renderSidebar();
  toast('Inserted into '+s.title);
}

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }

renderSidebar(); renderEditor(); initDB();
</script>
